plugins {
    id 'com.android.application'
}

android {
    namespace 'app.hereisswapnil.cameratv'
    compileSdk 34

    defaultConfig {
        applicationId 'app.hereisswapnil.cameratv'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.media3:media3-exoplayer:1.3.1'
    implementation files('libs/media3-exoplayer-rtsp-1.3.1.aar')
    implementation 'androidx.media3:media3-ui:1.3.1'
}
